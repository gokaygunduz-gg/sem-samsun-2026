name: SEM Panel Güncelle

on:
  push:
    branches: [main]
  schedule:
    # 28-30 Temmuz yarış günleri — her 2 dakikada bir
    # 05:00-20:59 UTC = 08:00-23:59 TR (tüm gün + akşam seansı)
    - cron: '*/5 5-20 28-30 7 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # workflow_dispatch API için gerekli

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Bot commit push'ları yeniden tetiklemesin — cascade API ile yönetilir
    if: "!(github.event_name == 'push' && github.actor == 'github-actions[bot]')"

    concurrency:
      group: panel-update
      cancel-in-progress: true   # Yeni tetiklenince eskisi iptal, taze başla

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install openpyxl requests beautifulsoup4 pdfplumber

      - name: Panel verisi üret (canlı + giriş fallback)
        run: |
          python scripts/sem_generate.py --live --quiet || python scripts/sem_generate.py --quiet

      - name: Değişiklikleri commit ve push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panel/data.js data/results.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Panel güncellendi: $(TZ='Europe/Istanbul' date '+%d.%m %H:%M TR')"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Sonraki güncellemeyi tetikle (yarış penceresi içindeyse)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOUR=$(TZ=UTC date +%-H)
          DAY=$(date +%-d)
          MONTH=$(date +%-m)

          # Pencere: 28-30 Temmuz, 04:00-21:59 UTC (07:00-00:59 TR)
          IN_WINDOW=false
          if [ "$MONTH" -eq "7" ] && [ "$DAY" -ge "28" ] && [ "$DAY" -le "30" ] && \
             [ "$HOUR" -ge "4" ] && [ "$HOUR" -le "21" ]; then
            IN_WINDOW=true
          fi

          if [ "$IN_WINDOW" = "true" ]; then
            echo "Yaras penceresi icinde. 3 dakika sonra yeniden tetiklenecek..."
            sleep 150
            gh workflow run update.yml --ref main \
              && echo "OK: sonraki calisma tetiklendi" \
              || echo "WARN: dispatch hatasi — cron 15dk icinde devralir"
          else
            echo "Yaras penceresi disinda (UTC $HOUR:xx). Cascade durduruldu."
          fi
